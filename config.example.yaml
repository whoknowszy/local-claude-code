# LCCG - Local Claude Code Gateway Configuration

server:
  host: "127.0.0.1"
  port: 8765
  # api_key: "proxy-auth-key"  # Optional: auth for the proxy itself

logging:
  level: "info"  # debug | info | warning | error

providers:
  - name: minimax
    type: anthropic
    priority: 1          # Lower number = higher priority (used for fallback chain)
    base_url: "https://api.minimaxi.com/anthropic/v1/messages"
    api_key: "${MINIMAX_API_KEY}"
    auth_scheme: "bearer"
    models:
      - "MiniMax-M2.7"

  - name: openai
    type: openai
    priority: 2
    base_url: "https://api.openai.com/v1/chat/completions"
    api_key: "${OPENAI_API_KEY}"
    models:
      - "gpt-4o"
      - "gpt-4o-mini"

router:
  # 模型别名映射: maps incoming model name to provider,model
  # 单路由: "model-alias": "provider,model"
  # 回退链: "model-alias": ["p1,m1", "p2,m2"]
  model_map:
    # "claude-sonnet-4-6": "openrouter,anthropic/claude-sonnet-4-5"

  # 默认路由（当无其他规则匹配时使用）
  default: "minimax,MiniMax-M2.7"

  # 故障回退路由（全局 fallback，优先级最低）
  # fallback: "minimax,MiniMax-M2.7"
