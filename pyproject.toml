[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lccg"
version = "0.1.0"
description = "Local Claude Code Gateway - A local model gateway proxy for Claude Code"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=2.2.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "rich>=13.9.0",
    "structlog>=24.4.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.8.0",
]

[project.scripts]
lccg = "lccg.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/lccg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
