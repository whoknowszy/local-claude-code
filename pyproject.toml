[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lccg"
version = "0.3.0"
description = "Local Claude Code Gateway - A local model gateway proxy for Claude Code"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "fastapi>=0.104.0,<0.115.0",
    "uvicorn[standard]>=0.24.0,<0.34.0",
    "sse-starlette>=2.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0,<2.10.0",
    "pydantic-settings>=2.1.0,<2.7.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "rich>=13.7.0,<13.9.0",
    "structlog>=24.4.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.8.0",
]

[project.scripts]
lccg = "lccg.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/lccg"]

[tool.hatch.build.targets.sdist]
include = [
    "ui/src/**/*",
    "ui/package.json",
    "ui/svelte.config.js",
    "ui/vite.config.ts",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
